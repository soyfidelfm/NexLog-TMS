<header class="flex h-16 flex-shrink-0 items-center justify-between border-b border-slate-800 bg-slate-900/50 px-4 lg:px-6">
  <div class="flex items-center gap-3">
    <button type="button" (click)="toggleMenu.emit()"
            class="rounded-lg p-2 text-slate-400 hover:bg-slate-800 hover:text-white lg:hidden"
            [attr.aria-label]="'layout.toggleMenu' | translate">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="hidden text-sm text-slate-400 sm:block">{{ 'layout.tms' | translate }}</div>
  </div>
  <div class="flex items-center gap-4">
    <app-language-switcher />
    <button type="button" class="relative text-slate-400 hover:text-white" [attr.aria-label]="'common.notifications' | translate" [attr.title]="'common.notifications' | translate">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="absolute -right-0.5 -top-0.5 h-2 w-2 rounded-full bg-blue-500"></span>
    </button>
    <div class="hidden text-right text-sm sm:block">
      <div class="font-medium text-white">Fidel Filio</div>
      <div class="text-xs text-slate-400">{{ 'layout.role' | translate }}</div>
    </div>
    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-700 text-xs font-medium">FF</div>
  </div>
</header>
