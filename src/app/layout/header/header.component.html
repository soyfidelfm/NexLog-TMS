<header class="flex h-16 flex-shrink-0 items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 px-4 lg:px-6">
  <div class="flex items-center gap-3">
    <button type="button" (click)="toggleMenu.emit()"
            class="rounded-lg p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white lg:hidden"
            [attr.aria-label]="'layout.toggleMenu' | translate">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="hidden text-sm text-slate-500 dark:text-slate-400 sm:block">{{ 'layout.tms' | translate }}</div>
  </div>
  <div class="flex items-center gap-4">
    <button type="button" (click)="themeService.toggle()" class="rounded-lg p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800" title="Cambiar tema">
      @if (themeService.theme() === 'dark') {
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      } @else {
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      }
    </button>
    <app-language-switcher />
    <button type="button" class="relative text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white" [attr.aria-label]="'common.notifications' | translate" [attr.title]="'common.notifications' | translate">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="absolute -right-0.5 -top-0.5 h-2 w-2 rounded-full bg-blue-500"></span>
    </button>
    <div class="hidden text-right text-sm sm:block">
      <div class="font-medium text-slate-900 dark:text-white">Fidel Filio</div>
      <div class="text-xs text-slate-500 dark:text-slate-400">{{ 'layout.role' | translate }}</div>
    </div>
    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-700 text-xs font-medium text-slate-700 dark:text-slate-200">FF</div>
  </div>
</header>
