<header class="flex h-16 flex-shrink-0 items-center justify-between border-b border-line bg-panel/50 px-4 lg:px-6">
  <div class="flex items-center gap-3">
    <button type="button" (click)="toggleMenu.emit()"
            class="rounded-lg p-2 text-muted hover:bg-elevated hover:text-strong lg:hidden"
            [attr.aria-label]="'layout.toggleMenu' | translate">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="hidden text-sm text-muted sm:block">{{ 'layout.tms' | translate }}</div>
  </div>

  <div class="flex items-center gap-4">
    <!-- Notifications -->
    <button type="button" class="relative text-muted hover:text-strong">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="absolute -right-0.5 -top-0.5 h-2 w-2 rounded-full bg-blue-500"></span>
    </button>

    <!-- User menu -->
    <div class="relative">
      <button type="button" (click)="toggleUserMenu()" class="flex items-center gap-2 rounded-full focus:outline-none">
        @if (auth.user()?.picture && !avatarFailed()) {
          <img [src]="auth.user()!.picture" [alt]="auth.user()?.name || 'User'"
               class="h-8 w-8 rounded-full object-cover ring-2 ring-white/20"
               referrerpolicy="no-referrer"
               (error)="avatarFailed.set(true)" />
        } @else {
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-blue-500 to-violet-600 text-xs font-semibold text-white">
            {{ (auth.user()?.name || 'U').charAt(0).toUpperCase() }}
          </div>
        }
        <div class="hidden text-right text-sm sm:block">
          <div class="font-medium text-strong">{{ auth.user()?.name || 'User' }}</div>
          <div class="text-xs text-muted">{{ 'layout.role' | translate }}</div>
        </div>
      </button>

      @if (menuOpen()) {
        <div class="absolute right-0 mt-2 w-64 rounded-xl border border-line bg-panel shadow-xl ring-1 ring-black/5 z-50">
          <div class="p-3 border-b border-line">
            <div class="text-sm font-medium text-strong">{{ auth.user()?.name }}</div>
            <div class="text-xs text-muted truncate">{{ auth.user()?.email }}</div>
          </div>

          <div class="py-1">
            <div class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-muted">Settings</div>

            <!-- Language + Theme on one line -->
            <div class="flex items-center justify-between gap-2 px-3 py-2">
              <app-language-switcher />

              <button type="button" (click)="theme.toggle()"
                      class="flex h-8 w-8 items-center justify-center rounded-lg border border-line text-muted hover:bg-elevated hover:text-strong"
                      [attr.aria-label]="theme.isDark() ? 'Light mode' : 'Dark mode'">
                @if (theme.isDark()) {
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                  </svg>
                } @else {
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  </svg>
                }
              </button>
            </div>
          </div>

          <div class="border-t border-line py-1">
            <button type="button" (click)="logout()" class="flex w-full items-center gap-2 px-3 py-2.5 text-sm text-red-500 hover:bg-elevated">
              Log out
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>

<!-- Click outside to close menu -->
@if (menuOpen()) {
  <div class="fixed inset-0 z-40" (click)="closeMenu()"></div>
}
