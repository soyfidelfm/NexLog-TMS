<header class="flex h-16 flex-shrink-0 items-center justify-between border-b border-line bg-panel/50 px-4 lg:px-6">
  <div class="flex items-center gap-3">
    <button type="button" (click)="toggleMenu.emit()"
            class="rounded-lg p-2 text-muted hover:bg-elevated hover:text-strong lg:hidden"
            [attr.aria-label]="'layout.toggleMenu' | translate">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="hidden text-sm text-muted sm:block">{{ 'layout.tms' | translate }}</div>
  </div>
  <div class="flex items-center gap-4">
    <button type="button" (click)="theme.toggle()"
            class="rounded-lg p-2 text-muted hover:bg-elevated hover:text-strong"
            [attr.aria-label]="(theme.isDark() ? 'layout.themeToLight' : 'layout.themeToDark') | translate"
            [attr.title]="(theme.isDark() ? 'layout.themeToLight' : 'layout.themeToDark') | translate">
      @if (theme.isDark()) {
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      } @else {
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      }
    </button>
    <app-language-switcher />
    <button type="button" class="relative text-muted hover:text-strong" [attr.aria-label]="'common.notifications' | translate" [attr.title]="'common.notifications' | translate">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="absolute -right-0.5 -top-0.5 h-2 w-2 rounded-full bg-blue-500"></span>
    </button>
    <div class="hidden text-right text-sm sm:block">
      <div class="font-medium text-strong">Fidel Filio</div>
      <div class="text-xs text-muted">{{ 'layout.role' | translate }}</div>
    </div>
    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-elevated-2 text-xs font-medium">FF</div>
  </div>
</header>
