<aside
  class="fixed inset-y-0 left-0 z-40 flex flex-shrink-0 flex-col border-r border-line bg-surface transition-all duration-200 lg:static lg:translate-x-0 lg:bg-panel/80"
  [class.w-64]="!collapsed()"
  [class.w-20]="collapsed()"
  [class.-translate-x-full]="!open()"
  [attr.aria-label]="'layout.mainNav' | translate"
>
  <!-- Logo area -->
  <div class="flex shrink-0 flex-col items-center border-b border-line px-3 py-3"
       [class.h-20]="!collapsed()"
       [class.h-auto]="collapsed()">
    <div class="flex w-full items-center" [class.justify-between]="!collapsed()" [class.justify-center]="collapsed()">
      <a routerLink="/dashboard" class="flex min-w-0 items-center justify-center" (click)="navigate.emit()">
        @if (!logoFailed()) {
          @if (collapsed()) {
            <img [src]="theme.isDark() ? '/iconInsideLight.png' : '/iconInside.png'"
                 [alt]="'layout.logoAlt' | translate"
                 class="h-12 w-12 object-contain"
                 (error)="logoFailed.set(true)" />
          } @else {
            <img [src]="theme.isDark() ? '/iconLoginLight.png' : '/iconLogin.png'"
                 [alt]="'layout.logoAlt' | translate"
                 class="h-16 w-auto object-contain"
                 (error)="logoFailed.set(true)" />
          }
        } @else {
          <div class="flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-blue-500 to-violet-600 text-xl font-bold text-white">N</div>
        }
      </a>

      <!-- Collapse toggle (desktop) -->
      <button type="button" (click)="toggleCollapsed()"
              class="hidden lg:flex h-8 w-8 items-center justify-center rounded-lg text-muted hover:bg-elevated hover:text-strong"
              [class.ml-1]="collapsed()"
              [attr.aria-label]="collapsed() ? 'Expand' : 'Collapse'">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          @if (collapsed()) {
            <path d="M9 18l6-6-6-6"/>
          } @else {
            <path d="M15 18l-6-6 6-6"/>
          }
        </svg>
      </button>
    </div>

    @if (collapsed()) {
      <div class="mt-1.5 text-center leading-tight">
        <div class="text-[11px] font-semibold tracking-wide text-strong">NexLog</div>
        <div class="text-[9px] font-medium uppercase tracking-[0.15em] text-subtle">TMS</div>
      </div>
    }
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-2 py-4">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-elevated text-strong"
        (click)="navigate.emit()"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-body transition-colors hover:bg-elevated/70 hover:text-strong"
        [class.justify-center]="collapsed()"
        [attr.title]="collapsed() ? (item.labelKey | translate) : null"
      >
        <span class="w-5 text-center text-lg">{{ item.icon }}</span>
        @if (!collapsed()) {
          <span>{{ item.labelKey | translate }}</span>
        }
      </a>
    }
  </nav>

  @if (!collapsed()) {
    <div class="border-t border-line p-4 text-xs text-subtle">
      {{ 'layout.footer' | translate }}
    </div>
  }
</aside>
