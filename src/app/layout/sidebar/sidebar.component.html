<aside
  class="fixed inset-y-0 left-0 z-40 flex w-64 flex-shrink-0 flex-col border-r border-line bg-surface transition-transform duration-200 lg:static lg:translate-x-0 lg:bg-panel/80"
  [class.-translate-x-full]="!open()"
  [attr.aria-label]="'layout.mainNav' | translate"
>
  <div class="flex h-20 items-center border-b border-line px-4">
    <a routerLink="/dashboard" class="flex items-center gap-3.5" (click)="navigate.emit()">
      @if (!logoFailed()) {
        <img src="/iconInside.png" [alt]="'layout.logoAlt' | translate" class="h-14 w-14 object-contain"
             (error)="logoFailed.set(true)" />
      } @else {
        <div class="flex h-14 w-14 items-center justify-center rounded-xl bg-gradient-to-br from-blue-500 to-violet-600 text-lg font-bold text-white">N</div>
      }
      <div class="min-w-0">
        <div class="text-lg font-semibold leading-tight text-strong truncate">NexLog</div>
        <div class="text-[11px] text-muted leading-none mt-0.5">TMS</div>
      </div>
    </a>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-elevated text-strong"
        (click)="navigate.emit()"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-body transition-colors hover:bg-elevated/70 hover:text-strong"
      >
        <span class="w-5 text-center text-lg">{{ item.icon }}</span>
        <span>{{ item.labelKey | translate }}</span>
      </a>
    }
  </nav>

  <div class="border-t border-line p-4 text-xs text-subtle">
    {{ 'layout.footer' | translate }}
  </div>
</aside>
