<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>NexlogTms</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved theme before Angular boots to avoid a flash of the wrong theme.
    try { if (localStorage.getItem('nexlog.theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
