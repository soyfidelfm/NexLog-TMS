      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nexlog_carriers;Username=postgres;Password=postgres
      AUTH0__DOMAIN: ${AUTH0_DOMAIN:-dev-fidelfm.us.auth0.com}
