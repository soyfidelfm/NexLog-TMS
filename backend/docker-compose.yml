# NexLog TMS backend: PostgreSQL + 14 microservices + YARP gateway
# AUTH0_DOMAIN / AUTH0_AUDIENCE se pueden poner en backend/.env
# docker compose up --build   -> gateway http://localhost:5100
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  orders:
    build:
      context: .
      args:
        PROJECT: src/Services/Orders/NexLog.Orders.Api/NexLog.Orders.Api.csproj
        ASSEMBLY: NexLog.Orders.Api
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=nexlog_orders;Username=postgres;Password=postgres
      AUTH0__DOMAIN: ${AUTH0_DOMAIN:-dev-fidelfm.us.auth0.com}
      AUTH0__AUDIENCE: ${AUTH0_AUDIENCE:-https://api.nexlog-tms}
    ports: ["5101:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  carriers:
    build:
      context: .
      args:
        PROJECT: src/Services/Carriers/NexLog.Carriers.Api/NexLog.Carriers.Api.csproj
        ASSEMBLY: NexLog.Carriers.Api
